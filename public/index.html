<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BroadcastEngine Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: #1e293b; padding: 24px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #38bdf8; }
        .status { font-weight: bold; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        .disconnected { background: #7f1d1d; color: #fca5a5; }
        .connected { background: #14532d; color: #86efac; }
        input, textarea, button { width: 100%; box-sizing: border-box; margin-top: 8px; margin-bottom: 16px; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; }
        button { background: #2563eb; font-weight: bold; border: none; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .code-box { background: #0284c7; color: #fff; text-align: center; font-size: 24px; font-weight: bold; letter-spacing: 4px; padding: 16px; border-radius: 8px; margin-top: 12px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>BroadcastEngine <span id="statusBadge" class="status disconnected">DISCONNECTED</span></h2>
        
        <h3>Device Connection</h3>
        <label>WhatsApp Phone Number (with country code)</label>
        <input type="text" id="phoneNum" placeholder="2348163883487">
        <button onclick="requestPairing()">Request Pairing Code</button>
        
        <div id="pairingCodeDisplay" class="code-box"></div>

        <hr style="border-color: #334155; margin: 24px 0;">

        <h3>Broadcast Campaign</h3>
        <label>Recipients (Comma separated)</label>
        <input type="text" id="recipients" placeholder="2348011112222, 2348033334444">
        
        <label>Message Body</label>
        <textarea id="message" rows="4" placeholder="Type your broadcast message here..."></textarea>
        
        <button onclick="sendCampaign()" style="background: #16a34a;">Send Campaign</button>
    </div>

    <script>
        async function checkStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                const badge = document.getElementById('statusBadge');
                if (data.connected) {
                    badge.textContent = 'CONNECTED';
                    badge.className = 'status connected';
                } else {
                    badge.textContent = 'DISCONNECTED';
                    badge.className = 'status disconnected';
                }
            } catch (e) {}
        }

        async function requestPairing() {
            const phone = document.getElementById('phoneNum').value;
            if (!phone) return alert('Please enter a phone number.');

            const codeBox = document.getElementById('pairingCodeDisplay');
            codeBox.style.display = 'block';
            codeBox.textContent = 'Generating code...';

            try {
                const res = await fetch('/api/pair', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phoneNumber: phone, force: true })
                });
                const data = await res.json();
                if (data.code) {
                    codeBox.textContent = data.code;
                } else if (data.error) {
                    codeBox.textContent = 'Error: ' + data.error;
                }
            } catch (e) {
                codeBox.textContent = 'Failed to fetch code.';
            }
        }

        async function sendCampaign() {
            const recipients = document.getElementById('recipients').value;
            const message = document.getElementById('message').value;

            if (!recipients || !message) return alert('Please fill in both fields.');

            try {
                const res = await fetch('/api/campaign/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ recipients, message })
                });
                const data = await res.json();
                alert(data.message || data.error);
            } catch (e) {
                alert('Failed to send campaign.');
            }
        }

        setInterval(checkStatus, 5000);
        checkStatus();
    </script>
</body>
</html>
